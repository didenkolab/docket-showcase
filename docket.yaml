# The projects this vault holds, and the vocabulary they share.
# A key is PROJECT-NUMBER and the project is a folder at the root.
# transitions is the workflow; leaving it out means anything can move
# to anything.
name: Northlight
projects:
  - key: HARBOR
    name: Harbor
  - key: LEDGER
    name: Ledgerline
  - key: FIELD
    name: Fieldnote
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: QA
    category: doing
  - name: Done
    category: done
  - name: Cancelled
    category: done
types:
  - name: epic
    level: 1
  - task
  - bug
  - story
  - name: subtask
    level: -1
  - name: test_plan
    level: 2
  - name: test_set
    level: 1
  - name: test_execution
    level: 1
    board: false
  - name: test
    level: 0
    board: false
  - name: test_run
    level: -1
    board: false
  - name: worklog
    level: -1
  - risk
  - name: objective
    level: 2
  - name: key_result
    level: 1
  - incident
  - postmortem
  - request
priorities:
  - low
  - normal
  - high
  - critical
fields:
  - name: steps
    label: Steps
    kind: text
    types:
      - test
    help: Or a gherkin block in the body, which the feature file collects.
  - name: preconditions
    label: Preconditions
    kind: text
    types:
      - test
  - name: automated
    label: Automated
    kind: flag
    types:
      - test
  - name: automation_id
    label: Automation id
    kind: text
    types:
      - test
      - test_run
    help: |
      What the runner calls this test — "suite.ClassName.method". The results importer matches on it, because a title is written for people and changes when somebody improves the wording.
  - name: generated
    label: Derived id
    kind: flag
    types:
      - test
    help: |
      The automation never named this test, so its id was derived from the feature file and the scenario name. Rename the scenario and it becomes a different test — tag the scenario to settle it.
  - name: environment
    label: Environment
    kind: text
    types:
      - test_execution
    required: true
    help: staging, production, a device — where these runs happened.
  - name: revision
    label: Revision
    kind: text
    types:
      - test_execution
    help: The build or commit. Without it a result is about no particular software.
  - name: started
    label: Started
    kind: datetime
    types:
      - test_execution
  - name: finished
    label: Finished
    kind: datetime
    types:
      - test_execution
  - name: result
    label: Result
    kind: choice
    choices:
      - todo
      - executing
      - passed
      - failed
      - aborted
    types:
      - test_run
    required: true
  - name: ran_at
    label: Ran at
    kind: datetime
    types:
      - test_run
  - name: evidence
    label: Evidence
    kind: text
    types:
      - test_run
    help: A link to the log, the screenshot, the recording.
  - name: spent
    label: Hours
    kind: number
    types:
      - worklog
    required: true
    help: Hours, as a number. Half an hour is 0.5.
  - name: worked_on
    label: Date
    kind: date
    types:
      - worklog
    required: true
  - name: billable
    label: Billable
    kind: flag
    types:
      - worklog
  - name: likelihood
    label: Likelihood
    kind: choice
    choices:
      - rare
      - unlikely
      - possible
      - likely
      - almost_certain
    types:
      - risk
    required: true
  - name: impact
    label: Impact
    kind: choice
    choices:
      - negligible
      - minor
      - moderate
      - major
      - severe
    types:
      - risk
    required: true
  - name: owner
    label: Owner
    kind: text
    types:
      - risk
    help: Who is watching this one. A risk nobody owns is a risk nobody sees.
  - name: reviewed_on
    label: Reviewed
    kind: date
    types:
      - risk
  - name: target
    label: Target
    kind: number
    types:
      - key_result
    required: true
    help: The number that means done. "Ninety per cent" is 90.
  - name: current
    label: Current
    kind: number
    types:
      - key_result
  - name: measure
    label: Measured by
    kind: text
    types:
      - key_result
    required: true
    help: Where the number comes from. A key result nobody can measure is a wish.
  - name: quarter
    label: Quarter
    kind: text
    types:
      - objective
      - key_result
  - name: severity
    label: Severity
    kind: choice
    choices:
      - sev1
      - sev2
      - sev3
    types:
      - incident
    required: true
    help: sev1 is money or data moving wrongly. sev3 is somebody inconvenienced.
  - name: detected_at
    label: Detected
    kind: datetime
    types:
      - incident
    required: true
  - name: resolved_at
    label: Resolved
    kind: datetime
    types:
      - incident
  - name: customers_affected
    label: Customers affected
    kind: text
    types:
      - incident
    help: A number, or how it was bounded. "Unknown" is an answer, and a finding.
  - name: asked_by
    label: Asked by
    kind: text
    types:
      - request
    required: true
    help: Who wants it. A request with no name behind it cannot be asked a question.
  - name: asked_on
    label: Asked
    kind: date
    types:
      - request
    required: true
  - name: wanted_by
    label: Wanted by
    kind: date
    types:
      - request
    help: A date somebody actually said. Not a guess, and not "asap".
  - name: definition_of_done
    label: Definition of done
    kind: choice
    choices:
      - team
      - release
      - hotfix
    help: Which list this work is held to. The lists themselves are documents.
pages:
  - name: coverage
    title: Test coverage
    run: hooks/coverage.sh
  - name: executions
    title: Executions
    run: hooks/executions.sh
  - name: feature
    title: Feature file
    run: hooks/feature.sh
  - name: time-in-status
    title: Time in status
    run: hooks/time-in-status.sh
  - name: anomalies
    title: Anomalies
    run: hooks/anomalies.sh
  - name: workload
    title: Workload
    run: hooks/workload.sh
  - name: acceptance
    title: Acceptance across the board
    run: hooks/across.sh
  - name: unsized
    title: Not sized
    run: hooks/unsized.sh
  - name: portfolio
    title: Portfolio
    run: hooks/portfolio.sh
panels:
  - name: runs-here
    title: Runs in this execution
    run: hooks/runs-here.sh
  - name: covered-by
    title: Tested by
    run: hooks/covered-by.sh
  - name: last-runs
    title: Last runs
    run: hooks/last-runs.sh
  - name: progress
    title: Acceptance
    run: hooks/progress.sh
inbox:
  - name: junit
    run: hooks/receive-junit.sh
    secret_env: DOCKET_JUNIT_SECRET
actions:
  - name: run-tests
    title: Run the scenarios
    run: hooks/run-tests.sh
    "on": feature
    confirm: Run every scenario now? Whatever the runner writes is committed.
apps:
  - name: tests
    source: /Volumes/Develop/develop/docket/apps#tests
    version: "12"
    brought:
      types:
        - test_plan
        - test_set
        - test_execution
        - test
        - test_run
      fields:
        - steps
        - preconditions
        - automated
        - automation_id
        - generated
        - environment
        - revision
        - started
        - finished
        - result
        - ran_at
        - evidence
      relations:
        - tests
        - tested_by
        - runs
        - run_by
        - found
        - found_in
        - includes
        - included_in
      pages:
        - coverage
        - executions
        - feature
      panels:
        - runs-here
        - covered-by
        - last-runs
      actions:
        - run-tests
        - junit
  - name: time
    source: /Volumes/Develop/develop/docket/apps#time
    version: "1"
    brought:
      types:
        - worklog
      fields:
        - spent
        - worked_on
        - billable
      relations:
        - logs
        - logged
  - name: risks
    source: /Volumes/Develop/develop/docket/apps#risks
    version: "1"
    brought:
      types:
        - risk
      fields:
        - likelihood
        - impact
        - owner
        - reviewed_on
      relations:
        - threatens
        - threatened_by
        - mitigated_by
        - mitigates
  - name: okr
    source: /Volumes/Develop/develop/docket/apps#okr
    version: "1"
    brought:
      types:
        - objective
        - key_result
      fields:
        - target
        - current
        - measure
        - quarter
      relations:
        - contributes_to
        - advanced_by
  - name: incidents
    source: /Volumes/Develop/develop/docket/apps#incidents
    version: "1"
    brought:
      types:
        - incident
        - postmortem
      fields:
        - severity
        - detected_at
        - resolved_at
        - customers_affected
      relations:
        - explains
        - explained_by
  - name: intake
    source: /Volumes/Develop/develop/docket/apps#intake
    version: "1"
    brought:
      types:
        - request
      fields:
        - asked_by
        - asked_on
        - wanted_by
      relations:
        - became
        - came_from
  - name: time_in_status
    source: /Volumes/Develop/develop/docket/apps#time-in-status
    version: "1"
    brought:
      pages:
        - time-in-status
  - name: anomalies
    source: /Volumes/Develop/develop/docket/apps#anomalies
    version: "1"
    brought:
      pages:
        - anomalies
  - name: workload
    source: /Volumes/Develop/develop/docket/apps#workload
    version: "2"
    brought:
      pages:
        - workload
  - name: checklists
    source: /Volumes/Develop/develop/docket/apps#checklists
    version: "1"
    brought:
      fields:
        - definition_of_done
      pages:
        - acceptance
      panels:
        - progress
  - name: estimation
    source: /Volumes/Develop/develop/docket/apps#estimation
    version: "1"
    brought:
      pages:
        - unsized
  - name: portfolio
    source: /Volumes/Develop/develop/docket/apps#portfolio
    version: "1"
    brought:
      pages:
        - portfolio
relations:
  - name: tests
    inverse: tested_by
  - name: runs
    inverse: run_by
  - name: found
    inverse: found_in
  - name: includes
    inverse: included_in
  - name: logs
    inverse: logged
  - name: threatens
    inverse: threatened_by
  - name: mitigated_by
    inverse: mitigates
  - name: contributes_to
    inverse: advanced_by
  - name: explains
    inverse: explained_by
  - name: became
    inverse: came_from
estimates:
  unit: story points
  scale:
    - 1
    - 2
    - 3
    - 5
    - 8
    - 13
transitions:
  Backlog:
    - Ready
    - Cancelled
  Cancelled:
    - Backlog
  Done:
    - In progress
  In progress:
    - In review
    - Ready
    - Cancelled
  In review:
    - QA
    - In progress
    - Cancelled
  QA:
    - Done
    - In progress
  Ready:
    - In progress
    - Backlog
    - Cancelled
